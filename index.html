<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data: http: https:; connect-src 'self' http: https: ws: wss:; media-src 'self' data: blob: http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
  <!-- App Icon -->
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="shortcut icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Core</title>
    <link rel="stylesheet" href="/src/universal-tab-styles.css" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #1a1a1a; color: #fff; }
      #startup-splash { min-height: 100vh; display: grid; place-items: center; font: 500 1rem/1.5 system-ui, sans-serif; }
      #startup-splash > div { display: flex; align-items: center; gap: .75rem; }
      #startup-splash span { width: 1rem; height: 1rem; border: 2px solid #475569; border-top-color: #60a5fa; border-radius: 50%; animation: startup-spin .8s linear infinite; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div id="startup-splash" role="status" aria-live="polite"><div><span aria-hidden="true"></span>Starting Minecraft Core…</div></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
