name: Build and Release

on:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and run every release gate on this ref, then stop before publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: minecraft-core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Decide whether this run builds and publishes
        id: plan
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/release-plan.cjs plan

  build:
    needs: check-version
    if: needs.check-version.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Use the long form of the runner temp directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hosted Windows images expose TEMP and TMP as the 8.3 alias C:\Users\RUNNER~1\...; the exact-path
          # checks in durable-fs and the packaged smoke treat that alias as a redirect. Use the same folder, long form.
          $long = (& node -p "require('node:fs').realpathSync.native(process.env.TEMP)").Trim()
          if ($LASTEXITCODE -ne 0 -or $long.Contains('~') -or -not [IO.Path]::IsPathRooted($long)) {
            throw "Could not resolve a long-form temporary directory (got '$long')."
          }
          "TEMP=$long" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$long" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "TEMP and TMP: $long"

      - name: Use the npm that wrote package-lock.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install -g npm@12.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Installing npm 12.0.2 failed.' }
          $npmVersion = (npm --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $npmVersion -ne '12.0.2') { throw "Expected npm 12.0.2, found '$npmVersion'." }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.204

      - name: Require Windows x64 host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($architecture -ne [System.Runtime.InteropServices.Architecture]::X64) {
            throw "The release archive worker requires a Windows X64 host; observed $architecture."
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify or acquire pinned 7-Zip runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredRuntimeFiles = @(
            'vendor/7zip/x64/7z.exe',
            'vendor/7zip/x64/7z.dll',
            'vendor/7zip/x64/License.txt'
          )
          if ($requiredRuntimeFiles.Where({ -not (Test-Path -LiteralPath $_ -PathType Leaf) }).Count -gt 0) {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/acquire-7zip.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Pinned 7-Zip acquisition failed.' }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/acquire-7zip.ps1 -PolicySelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Pinned 7-Zip acquisition policy self-test failed.' }
          npm run verify:archive-runtime

      - name: Verify committed archive worker identity
        run: npm run verify:archive-worker

      - name: Build native recovery policy tests
        run: dotnet build native/ArchiveWorker.RecoveryTests/ArchiveWorker.RecoveryTests.csproj --configuration Release --nologo

      - name: Run complete test suite
        timeout-minutes: 75
        run: npm test

      - name: Run focused modpack suite
        timeout-minutes: 45
        run: npm run test:modpacks

      - name: Run lifecycle failure matrix
        timeout-minutes: 20
        run: npm run test:failure-matrix

      - name: Build Vite app
        run: npm run build

      - name: Run modpack Electron E2E
        run: npm run test:e2e:modpacks

      - name: Install pinned Playwright Chromium
        run: node node_modules/playwright/cli.js install chromium

      - name: Run modpack launch reconciliation browser tests
        run: npm run test:e2e:modpack-launch-reconciliation

      - name: Build unpacked Windows app
        run: npm run pack

      - name: Verify packaged archive runtime
        run: npm run verify:packaged-archive

      - name: Run packaged modpack smoke
        run: npm run smoke:packaged:modpacks

      - name: Build Windows installer
        run: npm run dist

      - name: Verify the installer's update feed configuration
        run: node scripts/verify-release-artifacts.cjs --app-update dist/win-unpacked

      - name: Re-verify final installer payload
        run: npm run verify:packaged-archive

      - name: Re-smoke final installer payload
        run: npm run smoke:packaged:modpacks

      - name: Verify exact release artifacts
        run: node scripts/verify-release-artifacts.cjs dist ${{ needs.check-version.outputs.version }}

      - name: Keep the verified release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files-v${{ needs.check-version.outputs.version }}
          path: |
            dist/Minecraft-Core-Setup-${{ needs.check-version.outputs.version }}.exe
            dist/Minecraft-Core-Setup-${{ needs.check-version.outputs.version }}.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  stage:
    needs: [ check-version, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Fetch the verified release files
        uses: actions/download-artifact@v8
        with:
          name: release-files-v${{ needs.check-version.outputs.version }}
          path: dist

      - name: Re-verify the staged release files
        run: node scripts/verify-release-artifacts.cjs dist ${{ needs.check-version.outputs.version }}

  publish:
    needs: [ check-version, build, stage ]
    if: needs.check-version.outputs.publish == 'true' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Fetch the verified release files
        uses: actions/download-artifact@v8
        with:
          name: release-files-v${{ needs.check-version.outputs.version }}
          path: dist

      - name: Re-verify the release files before publication
        run: node scripts/verify-release-artifacts.cjs dist ${{ needs.check-version.outputs.version }}

      - name: Discard unpublished drafts from an earlier attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.cjs discard-stale-drafts

      - name: Create the draft release
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Minecraft Core v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/Minecraft-Core-Setup-${{ needs.check-version.outputs.version }}.exe
            dist/Minecraft-Core-Setup-${{ needs.check-version.outputs.version }}.exe.blockmap
            dist/latest.yml
          body: |
            ### Download
            - **Windows**: Download the `.exe` file below
            - **Auto-Updates**: Existing users will be notified of this update automatically

            ### Installation
            1. Download the `.exe` file
            2. Run the installer
            3. Follow the setup wizard

      - name: Verify the draft and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: node scripts/release-plan.cjs verify-and-publish

      - name: Confirm the update feed existing users read
        run: node scripts/release-plan.cjs confirm-feed
